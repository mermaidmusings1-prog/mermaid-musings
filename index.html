<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Mermaid Musings — coming soon</title>
<meta name="description" content="Mermaid Musings — something new is coming. Follow along on Instagram @mermaid_musings_club." />
<meta property="og:title" content="Mermaid Musings" />
<meta property="og:description" content="Something new is coming. Follow along on Instagram @mermaid_musings_club." />
<meta property="og:type" content="website" />
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%90%9A%3C/text%3E%3C/svg%3E" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --deep: #062a3a;
    --sea: #0e5c6b;
    --foam: #7fd4c1;
    --sand: #f3ece1;
    --shell: #e8b9a8;
    --text: #f6faf9;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    color: var(--text);
    background:
      radial-gradient(120% 90% at 20% 0%, rgba(127,212,193,.28) 0%, rgba(6,42,58,0) 60%),
      radial-gradient(100% 80% at 90% 100%, rgba(232,185,168,.22) 0%, rgba(6,42,58,0) 55%),
      linear-gradient(170deg, var(--deep) 0%, var(--sea) 100%);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 8vh 24px;
    position: relative;
    overflow-x: hidden;
  }
  .wrap { max-width: 660px; animation: rise 1s ease-out both; }
  @keyframes rise { from { opacity: 0; transform: translateY(14px);} to { opacity: 1; transform: none; } }
  .eyebrow {
    font-size: .78rem; letter-spacing: .34em; text-transform: uppercase;
    color: var(--foam); font-weight: 500; margin-bottom: 26px;
  }
  h1 {
    font-family: 'Cormorant Garamond', Georgia, serif;
    font-weight: 600;
    font-size: clamp(2.9rem, 9vw, 5.2rem);
    line-height: 1.02;
    margin: 0 0 22px;
  }
  h1 span { display: block; color: var(--foam); }
  p.lede {
    font-size: clamp(1.02rem, 2.4vw, 1.2rem);
    font-weight: 300;
    line-height: 1.65;
    color: rgba(246,250,249,.86);
    margin: 0 auto 38px;
    max-width: 30rem;
  }
  .actions { display: flex; gap: 14px; justify-content: center; flex-wrap: wrap; }
  a.btn {
    display: inline-flex; align-items: center; gap: 9px;
    padding: 14px 26px; border-radius: 999px;
    font-size: .95rem; font-weight: 500; text-decoration: none;
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  a.primary { background: var(--foam); color: var(--deep); box-shadow: 0 10px 26px rgba(127,212,193,.24); }
  a.primary:hover { transform: translateY(-2px); box-shadow: 0 14px 32px rgba(127,212,193,.34); }
  a.ghost { border: 1px solid rgba(246,250,249,.32); color: var(--text); }
  a.ghost:hover { background: rgba(246,250,249,.09); transform: translateY(-2px); }
  .divider { width: 54px; height: 1px; background: rgba(246,250,249,.28); margin: 46px auto 20px; }
  footer { font-size: .78rem; color: rgba(246,250,249,.55); letter-spacing: .04em; }
  .waves { position: absolute; left: 0; right: 0; bottom: 0; height: 22vh; min-height: 120px; pointer-events: none; }
  .waves svg { width: 100%; height: 100%; display: block; }
</style>
</head>
<body>
  <main class="wrap">
    <div class="eyebrow">Coming soon</div>
    <h1>Mermaid<span>Musings</span></h1>
    <p class="lede">
      Something new is taking shape beneath the surface. The full site is on its way —
      until then, the story is unfolding over on Instagram.
    </p>
    <div class="actions">
      <a class="btn primary" href="https://www.instagram.com/mermaid_musings_club/" target="_blank" rel="noopener">Follow on Instagram</a>
      <a class="btn ghost" href="mailto:mermaidmusings.1@gmail.com">Get in touch</a>
    </div>
    <div class="divider"></div>
    <footer>&copy; <span id="y">2026</span> Mermaid Musings</footer>
  </main>
  <div class="waves" aria-hidden="true">
    <svg viewBox="0 0 1440 220" preserveAspectRatio="none">
      <path d="M0,120 C240,180 420,60 720,110 C1020,160 1200,70 1440,120 L1440,220 L0,220 Z" fill="rgba(127,212,193,.10)"/>
      <path d="M0,150 C260,200 480,100 760,145 C1040,190 1220,110 1440,155 L1440,220 L0,220 Z" fill="rgba(127,212,193,.14)"/>
    </svg>
  </div>
  <script>document.getElementById('y').textContent = new Date().getFullYear();</script>
</body>
</html>
